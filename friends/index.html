<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends — Lesson Lector</title>
<meta name="description" content="Your Lesson Lector friends and friend requests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </a>
    <nav class="main-nav">
      <a href="../index.html" class="nav-link">Home</a>
    </nav>
    <div class="header-actions" id="auth-actions"></div>
  </div>
</header>

<main class="app-main">
  <div class="app-container">
    <a href="../dashboard/index.html" class="back-link">← Back to Dashboard</a>
    <h1 class="app-title">Friends</h1>
    <p class="app-subtitle">Click a friend to view their profile, chat, block, or unfriend them.</p>

    <section class="dashboard-section">
      <h2>Incoming Requests</h2>
      <div id="incoming-requests" class="friend-list">
        <p class="empty-state">Loading...</p>
      </div>
    </section>

    <section class="dashboard-section">
      <h2>Sent Requests</h2>
      <div id="outgoing-requests" class="friend-list">
        <p class="empty-state">Loading...</p>
      </div>
    </section>

    <section class="dashboard-section">
      <h2>Your Friends</h2>
      <div id="friends-list" class="friend-list">
        <p class="empty-state">Loading...</p>
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="brand footer-brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </div>
    <p class="footer-copy">Lesson Lector by Denys Kyrylenko. Made for learners, not shareholders.</p>
  </div>
</footer>

<script type="module" src="../js/auth-ui.js"></script>
<script type="module" src="../js/friends.js"></script>
</body>
</html>
