<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Lesson Lector</title>
<meta name="description" content="Log in to your Lesson Lector account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </a>
    <nav class="main-nav">
      <a href="../index.html" class="nav-link">Home</a>
    </nav>
    <div class="header-actions" id="auth-actions"></div>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to keep your streak going.</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required>
      </div>

      <p class="form-alert" id="form-alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="../signup/index.html">Sign up</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="brand footer-brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </div>
    <p class="footer-copy">Lesson Lector by Denys Kyrylenko. Made for learners, not shareholders.</p>
  </div>
</footer>

<script type="module" src="../js/auth-ui.js"></script>
<script type="module" src="../js/login.js"></script>
</body>
</html>
