<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Lesson Lector</title>
<meta name="description" content="Your Lesson Lector dashboard: recent lessons and every subject web.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </a>
    <nav class="main-nav">
      <a href="../index.html" class="nav-link">Home</a>
    </nav>
    <div class="header-actions" id="auth-actions"></div>
  </div>
</header>

<main class="app-main">
  <div class="app-container">

    <div class="dashboard-top">
      <div>
        <h1 class="app-title">Your Dashboard</h1>
        <p class="app-subtitle">Pick up where you left off, or explore a new web.</p>
      </div>
      <div class="dashboard-stats" id="dashboard-stats"></div>
    </div>

    <div class="dashboard-quicklinks">
      <a href="../medals/index.html" class="quicklink-card">
        <span class="quicklink-icon">🎖️</span>
        <span>Medals</span>
      </a>
      <a href="../stars/index.html" class="quicklink-card">
        <span class="quicklink-icon">⭐</span>
        <span>Stars</span>
      </a>
      <a href="../leaderboard/index.html" class="quicklink-card">
        <span class="quicklink-icon">🏆</span>
        <span>Leaderboard</span>
      </a>
      <a href="../friends/index.html" class="quicklink-card">
        <span class="quicklink-icon">👥</span>
        <span>Friends</span>
      </a>
    </div>

    <section class="dashboard-section">
      <h2>Continue Learning</h2>
      <div class="recent-row" id="recent-lessons">
        <p class="empty-state">Loading...</p>
      </div>
    </section>

    <section class="dashboard-section" id="subjects-list">
      <p class="empty-state">Loading subjects...</p>
    </section>

  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="brand footer-brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </div>
    <p class="footer-copy">Lesson Lector by Denys Kyrylenko. Made for learners, not shareholders.</p>
  </div>
</footer>

<script type="module" src="../js/auth-ui.js"></script>
<script type="module" src="../js/dashboard.js"></script>
</body>
</html>
