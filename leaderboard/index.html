<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Lesson Lector</title>
<meta name="description" content="Every Lesson Lector learner worldwide, ranked.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </a>
    <nav class="main-nav">
      <a href="../index.html" class="nav-link">Home</a>
    </nav>
    <div class="header-actions" id="auth-actions"></div>
  </div>
</header>

<main class="app-main">
  <div class="app-container">
    <a href="../dashboard/index.html" class="back-link">← Back to Dashboard</a>
    <h1 class="app-title">Worldwide Leaderboard</h1>
    <p class="app-subtitle">Every learner, ranked. 50 per page. Every player shows all their stats, no matter which filter you pick.</p>

    <div class="leaderboard-controls">
      <div class="leaderboard-filters">
        <button type="button" class="leaderboard-filter active" data-filter="gems">Gems</button>
        <button type="button" class="leaderboard-filter" data-filter="medals">Medals</button>
        <button type="button" class="leaderboard-filter" data-filter="stars">Stars</button>
      </div>
      <input type="text" id="leaderboard-search" class="search-input" placeholder="Search for a user...">
    </div>

    <div id="search-results" class="search-results" hidden></div>

    <div class="table-wrap">
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Gems</th>
            <th>Medals</th>
            <th>Stars</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr><td colspan="5" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="leaderboard-pagination"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="brand footer-brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </div>
    <p class="footer-copy">Lesson Lector by Denys Kyrylenko. Made for learners, not shareholders.</p>
  </div>
</footer>

<script type="module" src="../js/auth-ui.js"></script>
<script type="module" src="../js/leaderboard.js"></script>
</body>
</html>
