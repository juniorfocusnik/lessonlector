<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Free Account — Lesson Lector</title>
<meta name="description" content="Create a free Lesson Lector account and start learning by doing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="glow-orb orb-3"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </a>
    <nav class="main-nav">
      <a href="../index.html" class="nav-link">Home</a>
    </nav>
    <div class="header-actions" id="auth-actions"></div>
  </div>
</header>

<main class="auth-main">
  <div class="auth-card">
    <h1>Create your free account</h1>
    <p class="auth-sub">Join Lesson Lector — free forever, no credit card required.</p>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="e.g. curious_learner" required minlength="3" maxlength="20">
        <p class="field-status" id="username-status"></p>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label for="confirm-password">Retype Password</label>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" placeholder="Retype your password" required minlength="6">
        <p class="field-status" id="confirm-status"></p>
      </div>

      <div class="form-check">
        <input type="checkbox" id="agree-terms" required>
        <label for="agree-terms">I agree to the <a href="../terms/index.html" target="_blank" class="inline-link">Terms of Service</a></label>
      </div>

      <p class="form-alert" id="form-alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="../login/index.html">Log in</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="brand footer-brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Lesson Lector</span>
    </div>
    <p class="footer-copy">Lesson Lector by Denys Kyrylenko. Made for learners, not shareholders.</p>
  </div>
</footer>

<script type="module" src="../js/auth-ui.js"></script>
<script type="module" src="../js/signup.js"></script>
</body>
</html>
